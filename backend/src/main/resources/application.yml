spring:
  application:
    name: linker-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5500/linker}
    username: ${DB_USERNAME:linker}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
