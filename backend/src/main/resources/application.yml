spring:
  application:
    name: linker-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5500/linker}
    username: ${DB_USERNAME:linker}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

linker:
  session:
    cookie-name: ${SESSION_COOKIE_NAME:linker_session}
    same-site: Lax
    secure: ${SESSION_COOKIE_SECURE:false}
    domain: ${SESSION_COOKIE_DOMAIN:}
    path: /
    lifetime-days: 30
    # RS256. Private key is PKCS#8 PEM; public key is SPKI PEM, the same value as the web JWT_PUBLIC_KEY.
    jwt-private-key: ${JWT_PRIVATE_KEY:}
    jwt-public-key: ${JWT_PUBLIC_KEY:}
  security:
    public-read-per-minute: 60
    enforce-origin: false
    allowed-origins: ${ALLOWED_ORIGINS:}
    trust-forwarded-for: false
  storage:
    mode: ${STORAGE_MODE:unconfigured}
    local-dir: ${STORAGE_LOCAL_DIR:}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  webhook:
    consumer-enabled: true
    queue-key: linker:github:webhook
  payment:
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
