services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linker_github_test
      POSTGRES_USER: linker_test
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run init first}
    ports:
      - "127.0.0.1:${TEST_DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linker_test -d linker_github_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
  redisdata:
