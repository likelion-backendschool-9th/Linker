# Independent from the application release: no DB/JWT settings or app restart required.
name: linker-ollama

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.15}
    restart: unless-stopped
    cpus: ${OLLAMA_CPUS:-2.0}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    memswap_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "16"
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models:
