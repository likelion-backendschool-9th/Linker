# Only publish to loopback behind host Nginx. The host MUST overwrite forwarded headers.
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserve only a single known protocol value; never pass arbitrary header content.
map $http_x_forwarded_proto $linker_forwarded_proto {
    default http;
    https https;
}

map $http_x_real_ip $linker_client_ip {
    default $http_x_real_ip;
    '' $remote_addr;
}

map $http_upgrade $linker_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Photos are up to 10MB each (Policy ch. 2); the upload PUT carries one file.
    client_max_body_size 11m;

    set $web_upstream http://web:3000;
    set $backend_upstream http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $linker_client_ip;
    proxy_set_header X-Forwarded-For $linker_client_ip;
    proxy_set_header X-Forwarded-Proto $linker_forwarded_proto;
    proxy_buffering off;

    location ^~ /api/v1/ {
        proxy_pass $backend_upstream$request_uri;
    }

    # Uploaded images (local storage), served by the backend's static handler
    location ^~ /files/ {
        proxy_pass $backend_upstream$request_uri;
    }

    # Reserved for a later BFF implementation; API routing is unchanged.
    location ^~ /api/bff/ {
        proxy_pass $web_upstream$request_uri;
    }

    location ~ ^/ws(?:/|$) {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $linker_client_ip;
        proxy_set_header X-Forwarded-For $linker_client_ip;
        proxy_set_header X-Forwarded-Proto $linker_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $linker_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass $web_upstream$request_uri;
    }
}
