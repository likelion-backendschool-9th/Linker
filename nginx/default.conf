# Docker's embedded DNS: resolve recreated containers without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    set $web_upstream http://web:3000;
    set $backend_upstream http://backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Existing REST APIs, including /api/v1/webhook/github, retain their full path.
    location ^~ /api/v1/ {
        proxy_pass $backend_upstream$request_uri;
    }

    # Reserve this path for the future Next.js BFF; it is not implemented yet.
    location ^~ /api/bff/ {
        proxy_pass $web_upstream$request_uri;
    }

    # /ws and /ws/... go directly to Spring, without passing through Next.js.
    location ~ ^/ws(?:/|$) {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The STOMP client/server must exchange heartbeats within this timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass $web_upstream$request_uri;
    }
}
