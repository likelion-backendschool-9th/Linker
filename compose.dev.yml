# Opt in: docker compose -f compose.yml -f compose.dev.yml up --build --watch
# Validated with Docker Compose 5.6.0; CI installs the same version.
services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  backend:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      mailpit:
        condition: service_started

  web:
    build:
      target: development
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./frontend/apps/web
          target: /app/apps/web
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - .env*
            - next-env.d.ts
            - "*.tsbuildinfo"
            - package.json
            - next.config.ts
        - action: sync
          path: ./frontend/packages
          target: /app/packages
          initial_sync: true
          ignore:
            - "**/node_modules/"
            - "**/.env*"
            - "**/*.tsbuildinfo"
            - "**/package.json"
        - action: sync+restart
          path: ./frontend/apps/web/next.config.ts
          target: /app/apps/web/next.config.ts
          initial_sync: true
        # Dependency changes must reinstall packages, rather than sync node_modules.
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/pnpm-workspace.yaml
        - action: rebuild
          path: ./frontend/apps/web/package.json
        - action: rebuild
          path: ./frontend/packages/api/package.json
        - action: rebuild
          path: ./frontend/packages/bridge/package.json
        - action: rebuild
          path: ./frontend/packages/config/package.json
        - action: rebuild
          path: ./frontend/Dockerfile
